events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
   
    server {
        listen 80;
        listen 443 ssl;
        listen [::]:443 ssl;
        ssl_certificate /etc/nginx/ssl/app.carsties.local.pem;
        ssl_certificate_key /etc/nginx/ssl/app.carsties.local-key.pem;
        server_name app.carsties.local;
        location / {
            proxy_pass http://webapp:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Next.js
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            autoindex on;

            location ~* \.(css|js|pdf|txt)$ {
                expires 6m;
                add_header Cache-Control "public";
            }
        }
       
    }
    

    server {
        listen 80;
        listen 443 ssl;
        listen [::]:443 ssl;
        ssl_certificate /etc/nginx/ssl/api.carsties.local.pem;
        ssl_certificate_key /etc/nginx/ssl/api.carsties.local-key.pem;
        server_name api.carsties.local;
        # SignalR Hub endpoint - route to notification service
        location / {
            proxy_pass http://gateway:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API-specific timeouts
            proxy_connect_timeout 15s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            
            # Handle large file uploads
            client_max_body_size 100M;
            
            # CORS headers for API
            add_header 'Access-Control-Allow-Origin' 'https://app.carsties.local' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
        }
    }
}