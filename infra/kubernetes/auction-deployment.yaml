apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-svc
spec:
  selector:
    matchLabels:
      app: auction-svc
  template:
    metadata:
      labels:
        app: auction-svc
    spec:
      containers:
      - name: auction-svc
        image: bardiyabasafabardiyabasafa/carsties-auction-api
        imagePullPolicy: Never
        envFrom:
          - configMapRef:
              name: auction-svc-config
        ports:
        - containerPort: 8080
          name: web
        - containerPort: 8001
